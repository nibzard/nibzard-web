name: Refresh LLM prices

on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-llm-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:prices
      - name: Fetch the upstream price list
        run: pnpm run prices:sync --strict
      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet -- src/data/llm-prices.json public/data/llm-prices.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the site build
        if: steps.changes.outputs.changed == 'true'
        env:
          PRICES_OFFLINE: '1'
          PROJECTS_OFFLINE: '1'
          TINA_SKIP_SEARCH_INDEX: '1'
        run: pnpm run build
      - name: Save the refreshed snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/llm-prices.json public/data/llm-prices.json
          git commit -m 'chore(prices): Refresh LLM price snapshot'
          git push
