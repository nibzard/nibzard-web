name: Refresh GitHub projects

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:projects
      - name: Fetch public project metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run projects:sync --strict
      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet -- src/data/github-projects.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the site build
        if: steps.changes.outputs.changed == 'true'
        env:
          PROJECTS_OFFLINE: '1'
          TINA_SKIP_SEARCH_INDEX: '1'
        run: pnpm run build
      - name: Save the refreshed snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/github-projects.json
          git commit -m 'chore(projects): Refresh GitHub snapshot'
          git push
